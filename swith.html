<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swith Challenge</title>
<meta name="theme-color" content="#12283F">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  body{background:#1565D8}
  .board{background:radial-gradient(circle at 50% 45%, #2C7BE8 0%, #0F4CA8 78%); border-radius:4px}
  .prompt{color:#fff}
  .wrap{display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.6vh,16px); padding:8px}
  .row{display:flex; gap:8px}
  .sym{width:clamp(50px,8.4vw,86px); height:clamp(50px,8.4vw,86px); background:#fff;
    display:grid; place-items:center}
  .sym svg{width:70%; height:70%}
  .arrow{width:clamp(44px,7vw,74px); color:#8BC53F}
  .codes{display:flex; gap:clamp(6px,1.6vw,16px)}
  .code{background:#fff; border:0; font-family:inherit; font-weight:600;
    font-size:clamp(17px,3vw,32px); letter-spacing:.06em; color:#183B56;
    padding:clamp(9px,1.6vh,18px) clamp(12px,2.4vw,30px); cursor:pointer;
    transition:transform .12s, box-shadow .12s}
  .code:hover{transform:translateY(-3px); box-shadow:0 7px 16px rgba(0,0,0,.28)}
  .code.right{box-shadow:0 0 0 4px var(--green) inset}
  .code.wrong{box-shadow:0 0 0 4px var(--red) inset}
  .label{color:#D7E6FB; font-size:12.5px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase}

/* ---------- feedback widget ---------- */
.nfb-fab,.nfb-back{
  --nfb-surface:#FFFFFF; --nfb-line:#D6DAE0; --nfb-text:#1B2430; --nfb-dim:#6C7885;
  --nfb-accent:#1565D8; --nfb-accent-ink:#FFFFFF; --nfb-star:#1565D8;
  --nfb-radius:8px; --nfb-font:'Poppins',system-ui,sans-serif; --nfb-head:'Poppins',system-ui,sans-serif;
}
.nfb-fab{
  position:fixed;right:16px;bottom:18px;z-index:9990;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:var(--nfb-head);font-size:13px;font-weight:700;line-height:1;
  padding:11px 16px;border:1px solid var(--nfb-accent);border-radius:999px;
  color:var(--nfb-accent-ink);background:var(--nfb-accent);
  box-shadow:0 8px 24px rgba(0,0,0,.34);
}
.nfb-fab:hover{filter:brightness(1.08)}
.nfb-fab:active{transform:translateY(1px)}
.nfb-fab svg{width:15px;height:15px;flex:none}
@media (max-width:560px){
  .nfb-fab b{display:none}
  .nfb-fab{padding:13px;border-radius:50%;right:12px}
}

.nfb-back{
  position:fixed;inset:0;z-index:9991;display:grid;place-items:center;padding:16px;
  background:rgba(3,7,12,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  font-family:var(--nfb-font);color:var(--nfb-text);overflow:auto;
}
.nfb-back[hidden]{display:none}
.nfb-card{
  position:relative;width:min(470px,100%);max-height:calc(100vh - 32px);overflow:auto;
  background:var(--nfb-surface);border:1px solid var(--nfb-line);
  border-radius:var(--nfb-radius);padding:20px 20px 18px;
  box-shadow:0 26px 64px rgba(0,0,0,.46);
}
.nfb-card h2{
  font-family:var(--nfb-head);font-size:19px;font-weight:800;margin:0 0 4px;
  color:var(--nfb-text);
}
.nfb-card p.nfb-sub{margin:0 0 16px;font-size:13.5px;color:var(--nfb-dim);line-height:1.45}
.nfb-x{
  position:absolute;top:12px;right:12px;width:30px;height:30px;cursor:pointer;
  display:grid;place-items:center;font-size:19px;line-height:1;
  color:var(--nfb-dim);background:none;border:1px solid var(--nfb-line);border-radius:8px;
}
.nfb-x:hover{color:var(--nfb-text)}
.nfb-f{display:block;border:0;padding:0;margin:0 0 15px;min-width:0}
.nfb-f > span,.nfb-f > legend{
  display:block;font-size:12.5px;font-weight:700;margin:0 0 7px;padding:0;
  color:var(--nfb-text);font-family:var(--nfb-head);
}
.nfb-f textarea{
  width:100%;resize:vertical;font:inherit;font-size:14px;line-height:1.5;
  padding:10px 12px;border-radius:calc(var(--nfb-radius) / 1.6);
  color:var(--nfb-text);background:transparent;border:1px solid var(--nfb-line);
}
.nfb-f textarea::placeholder{color:var(--nfb-dim);opacity:.85}
.nfb-f textarea:focus{outline:2px solid var(--nfb-accent);outline-offset:1px;border-color:transparent}
.nfb-stars{display:flex;align-items:center;gap:2px}
.nfb-star{
  cursor:pointer;background:none;border:0;padding:2px 3px;line-height:1;
  font-size:28px;color:var(--nfb-dim);opacity:.5;transition:transform .12s ease;
}
.nfb-star.on{color:var(--nfb-star);opacity:1}
.nfb-star:hover{transform:scale(1.14)}
.nfb-star:focus-visible{outline:2px solid var(--nfb-accent);outline-offset:2px;border-radius:6px}
.nfb-slab{margin-left:8px;font-size:12.5px;font-weight:600;color:var(--nfb-dim)}
.nfb-err{margin:0 0 12px;font-size:12.5px;font-weight:600;color:#B00020}
.nfb-err[hidden]{display:none}
.nfb-act{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.nfb-act button{
  cursor:pointer;font-family:var(--nfb-head);font-size:13px;font-weight:700;
  padding:10px 17px;border-radius:calc(var(--nfb-radius) / 1.4);border:1px solid var(--nfb-line);
  background:transparent;color:var(--nfb-dim);
}
.nfb-act button:hover{color:var(--nfb-text)}
.nfb-act .nfb-send{
  color:var(--nfb-accent-ink);background:var(--nfb-accent);border-color:var(--nfb-accent);
}
.nfb-act .nfb-send:hover{filter:brightness(1.08);color:var(--nfb-accent-ink)}
.nfb-done{text-align:center;padding:14px 4px 6px}
.nfb-done[hidden]{display:none}
.nfb-done .nfb-tick{font-size:40px;line-height:1;color:var(--nfb-accent)}
.nfb-done h3{font-family:var(--nfb-head);font-size:17px;margin:10px 0 6px;}
.nfb-done p{margin:0 0 16px;font-size:13.5px;color:var(--nfb-dim)}
@media (prefers-reduced-motion:reduce){
  .nfb-star,.nfb-fab{transition:none}
  .nfb-star:hover{transform:none}
}
</style>
</head>
<body>
<script src="common.js"></script>
<script>
(function () {
  "use strict";

  var GREEN = '#FFD15C';
  var SHAPES = ['circle','square','triangle','cross','percent','times'];

  function shapeSVG(kind){
    var s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    if (kind === 'circle')   s += '<circle cx="50" cy="50" r="40" fill="' + GREEN + '"/>';
    if (kind === 'square')   s += '<rect x="12" y="12" width="76" height="76" fill="' + GREEN + '"/>';
    if (kind === 'triangle') s += '<polygon points="50,10 92,88 8,88" fill="' + GREEN + '"/>';
    if (kind === 'cross')    s += '<path d="M38 8h24v30h30v24H62v30H38V62H8V38h30z" fill="' + GREEN + '"/>';
    if (kind === 'percent')  s += '<text x="50" y="74" font-size="82" font-family="Poppins,sans-serif" font-weight="700" text-anchor="middle" fill="' + GREEN + '">%</text>';
    if (kind === 'times')    s += '<path d="M22 12l28 28 28-28 10 10-28 28 28 28-10 10-28-28-28 28-10-10 28-28-28-28z" fill="' + GREEN + '"/>';
    return s + '</svg>';
  }
  function arrowSVG(up){
    return '<svg viewBox="0 0 100 60" aria-hidden="true" style="width:100%;height:auto">' +
      (up ? '<polygon points="50,2 84,34 66,34 66,58 34,58 34,34 16,34" fill="' + GREEN + '"/>'
          : '<polygon points="50,58 16,26 34,26 34,2 66,2 66,26 84,26" fill="' + GREEN + '"/>') +
      '</svg>';
  }

  function row(list){
    var r = CG.el('div', 'row');
    list.forEach(function (k){
      var t = CG.el('div', 'sym');
      t.innerHTML = shapeSVG(k);
      r.appendChild(t);
    });
    return r;
  }

  /* The code reads: for each position of the OUTPUT row, which position of the
     INPUT row did that symbol come from. Input ●■▲✚ -> output ▲■✚● is 3241. */
  function buildLevel(api, board){
    var level = api.level();
    var n = level < 5 ? 4 : 5;
    var input = CG.shuffle(SHAPES.slice()).slice(0, n);

    var order = CG.shuffle(input.map(function (_, i){ return i; }));   // output[i] = input[order[i]]
    var output = order.map(function (i){ return input[i]; });
    var answer = order.map(function (i){ return i + 1; }).join('');

    /* three decoys: real permutations, so no option can be ruled out by shape */
    var codes = [answer], guard = 0;
    while (codes.length < 4 && guard++ < 200){
      var alt = CG.shuffle(order.slice()).map(function (i){ return i + 1; }).join('');
      if (codes.indexOf(alt) < 0) codes.push(alt);
    }
    CG.shuffle(codes);

    var wrap = CG.el('div', 'wrap');
    wrap.appendChild(CG.el('div', 'label', 'Input'));
    wrap.appendChild(row(input));

    var up = CG.el('div', 'arrow');
    up.innerHTML = arrowSVG(true);
    wrap.appendChild(up);

    var codeRow = CG.el('div', 'codes');
    codes.forEach(function (code){
      var b = CG.el('button', 'code', code);
      b.addEventListener('click', function (){
        if (api.locked()) return;
        if (code === answer){ b.classList.add('right'); api.right('+3'); }
        else {
          b.classList.add('wrong');
          Array.prototype.forEach.call(codeRow.children, function (n2){
            if (n2.textContent === answer) n2.classList.add('right');
          });
          api.wrong('−1');
        }
      });
      codeRow.appendChild(b);
    });
    wrap.appendChild(codeRow);

    var down = CG.el('div', 'arrow');
    down.innerHTML = arrowSVG(false);
    wrap.appendChild(down);

    wrap.appendChild(row(output));
    wrap.appendChild(CG.el('div', 'label', 'Output'));
    board.appendChild(wrap);
  }

  CG.create({
    name:'Swith Challenge',
    tag:'Power of Logical Thinking',
    prompt:'Find the code that turns the input into the output',
    intro:['Here a few different symbols are displayed on both the top (input) and bottom (output) ' +
           'levels of the screen. Your task is to find the correct code of the output, based on the ' +
           'order of the input, from the given options in between the screen.',
           'Example: input ● ■ ▲ ✚ becoming output ▲ ■ ✚ ● is the code 3241 — each digit says which ' +
           'input position that output symbol came from.'],
    howto:['Time duration is 20 seconds or 25 seconds for a level.',
           'You need to click on the correct answer from the Answer Panel.',
           'Three marks added for each correct attempt and one mark is subtracted for each wrong attempt.'],
    session:240,
    levelTime:function (level){ return level < 5 ? 20 : 25; },
    pointsRight:3, pointsWrong:1, scoreFull:60,
    buildLevel:buildLevel
  });
})();
</script>

<!-- feedback widget: start (shared across the NIAT games; wire nfbConfig below) -->
<button type="button" class="nfb-fab" id="nfbFab" aria-haspopup="dialog" title="Share feedback">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.3-.6L3 21l1.8-4.9A8.1 8.1 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"></path></svg>
  <b>Feedback</b>
</button>

<div class="nfb-back" id="nfbBack" hidden>
  <div class="nfb-card" role="dialog" aria-modal="true" aria-labelledby="nfbTitle">
    <button type="button" class="nfb-x" id="nfbClose" aria-label="Close feedback">&times;</button>
    <h2 id="nfbTitle">Share your feedback</h2>
    <p class="nfb-sub">Half a minute, three questions. It goes straight to the NIAT team.</p>

    <form id="nfbForm" novalidate>
      <fieldset class="nfb-f">
        <legend>1. How would you rate Swith Challenge?</legend>
        <div class="nfb-stars" id="nfbStars" role="radiogroup" aria-label="Star rating"></div>
        <span class="nfb-slab" id="nfbSlab">Pick a star</span>
      </fieldset>

      <label class="nfb-f">
        <span>2. Additional feedback</span>
        <textarea id="nfbText" rows="3" placeholder="What worked well, what got in your way&hellip;"></textarea>
      </label>

      <label class="nfb-f">
        <span>3. Anything you want to add or change?</span>
        <textarea id="nfbChange" rows="3" placeholder="A level, a feature, a fix you would like&hellip;"></textarea>
      </label>

      <p class="nfb-err" id="nfbErr" hidden></p>
      <div class="nfb-act">
        <button type="button" id="nfbCancel">Cancel</button>
        <button type="submit" class="nfb-send" id="nfbSend">Send feedback</button>
      </div>
    </form>

    <div class="nfb-done" id="nfbDone" hidden>
      <div class="nfb-tick">&#10003;</div>
      <h3>Thanks &mdash; that helps.</h3>
      <p>Your feedback reached the team.</p>
      <div class="nfb-act"><button type="button" class="nfb-send" id="nfbBackToGame">Back to Swith Challenge</button></div>
    </div>
  </div>
</div>

<iframe name="nfb-sink" id="nfbSink" title="feedback sink" aria-hidden="true" tabindex="-1"
  style="position:absolute;left:-9999px;width:0;height:0;border:0"></iframe>
<!-- feedback widget: end -->
<script>
/* ---------- feedback widget ----------
   Three questions -> a Google Form. Fill nfbConfig in once per game:

     action  the Form's POST URL. Open the live form, copy the address-bar
             URL and swap the trailing "/viewform" for "/formResponse".
     rating / feedback / change
             the three field ids. On the live form use View Source and search
             for "entry." - each answer box carries an entry.NNNNNNNNN name,
             in the order the questions appear.

   Until it is filled in, answers are kept in this browser's localStorage
   (key "niat.feedback.<game>") and posted on the next load once a form is
   configured, so nothing a student types is lost. */
(function () {
  "use strict";

  var nfbConfig = {
    game: "swith",
    action: "",   // https://docs.google.com/forms/d/e/FORM_ID/formResponse
    rating: "",   // entry.000000000  -> star rating
    feedback: "", // entry.000000000  -> additional feedback
    change: ""    // entry.000000000  -> anything to add or change
  };

  var LABELS = ["", "Poor", "Fair", "Good", "Great", "Loved it"];
  var LOG_KEY = "niat.feedback." + nfbConfig.game;
  var QUEUE_KEY = "niat.feedback.queue." + nfbConfig.game;

  var fab = document.getElementById("nfbFab");
  var back = document.getElementById("nfbBack");
  var form = document.getElementById("nfbForm");
  var done = document.getElementById("nfbDone");
  var starBox = document.getElementById("nfbStars");
  var slab = document.getElementById("nfbSlab");
  var err = document.getElementById("nfbErr");
  var text = document.getElementById("nfbText");
  var change = document.getElementById("nfbChange");
  if (!fab || !back) return;

  var rating = 0;
  var lastFocus = null;

  /* ---- star rating: five radios, clickable and arrow-key navigable ---- */
  var stars = [];
  for (var i = 1; i <= 5; i++) {
    var s = document.createElement("button");
    s.type = "button";
    s.className = "nfb-star";
    s.textContent = "★";
    s.setAttribute("role", "radio");
    s.setAttribute("aria-checked", "false");
    s.setAttribute("aria-label", i + (i === 1 ? " star" : " stars"));
    s.tabIndex = i === 1 ? 0 : -1;
    s.setAttribute("data-v", String(i));
    starBox.appendChild(s);
    stars.push(s);
  }

  function setRating(v) {
    rating = v;
    stars.forEach(function (s, idx) {
      s.classList.toggle("on", idx < v);
      s.setAttribute("aria-checked", idx + 1 === v ? "true" : "false");
      s.tabIndex = idx + 1 === (v || 1) ? 0 : -1;
    });
    slab.textContent = v ? LABELS[v] : "Pick a star";
    if (v) hideError();
  }

  starBox.addEventListener("click", function (e) {
    var s = e.target.closest(".nfb-star");
    if (s) setRating(Number(s.getAttribute("data-v")));
  });
  starBox.addEventListener("keydown", function (e) {
    var step = e.key === "ArrowRight" || e.key === "ArrowUp" ? 1
      : e.key === "ArrowLeft" || e.key === "ArrowDown" ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    var next = Math.min(5, Math.max(1, (rating || 0) + step));
    setRating(next);
    stars[next - 1].focus();
  });

  function showError(msg) { err.textContent = msg; err.hidden = false; }
  function hideError() { err.hidden = true; }

  /* ---- open / close ---- */
  function openBox() {
    lastFocus = document.activeElement;
    back.hidden = false;
    document.addEventListener("keydown", onKey, true);
    stars[rating ? rating - 1 : 0].focus();
  }
  function closeBox() {
    back.hidden = true;
    document.removeEventListener("keydown", onKey, true);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function onKey(e) {
    if (e.key === "Escape") { e.stopPropagation(); closeBox(); }
  }

  fab.addEventListener("click", openBox);
  document.getElementById("nfbClose").addEventListener("click", closeBox);
  document.getElementById("nfbCancel").addEventListener("click", closeBox);
  document.getElementById("nfbBackToGame").addEventListener("click", closeBox);
  back.addEventListener("mousedown", function (e) { if (e.target === back) closeBox(); });

  /* ---- storage: reads and writes both throw in private mode ---- */
  function read(key) {
    try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* full or blocked */ }
  }

  function configured() {
    return !!(nfbConfig.action && nfbConfig.rating && nfbConfig.feedback && nfbConfig.change);
  }

  /* A cross-origin POST into a hidden iframe: no CORS to satisfy, and it
     works from file:// too, which is how these games are usually opened. */
  function post(entry) {
    var f = document.createElement("form");
    f.method = "POST";
    f.action = nfbConfig.action;
    f.target = "nfb-sink";
    f.style.display = "none";
    [[nfbConfig.rating, entry.rating],
     [nfbConfig.feedback, entry.feedback],
     [nfbConfig.change, entry.change]].forEach(function (pair) {
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = pair[0];
      input.value = pair[1];
      f.appendChild(input);
    });
    document.body.appendChild(f);
    f.submit();
    setTimeout(function () { f.remove(); }, 4000);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!rating) { showError("Pick a star rating first."); stars[0].focus(); return; }

    var entry = {
      game: nfbConfig.game,
      rating: String(rating),
      feedback: text.value.trim(),
      change: change.value.trim(),
      at: new Date().toISOString()
    };

    var log = read(LOG_KEY);
    log.push(entry);
    write(LOG_KEY, log);

    if (configured()) {
      post(entry);
    } else {
      var queue = read(QUEUE_KEY);
      queue.push(entry);
      write(QUEUE_KEY, queue);
      console.warn("[feedback] No Google Form wired up yet - answer kept in localStorage under \"" +
        QUEUE_KEY + "\" and sent once nfbConfig is filled in.");
    }

    form.hidden = true;
    done.hidden = false;
    document.getElementById("nfbBackToGame").focus();

    setRating(0);
    text.value = "";
    change.value = "";
    setTimeout(function () {
      closeBox();
      form.hidden = false;
      done.hidden = true;
      hideError();
    }, 2600);
  });

  /* Anything captured before the form was wired up goes out on the next load. */
  if (configured()) {
    var pending = read(QUEUE_KEY);
    if (pending.length) {
      write(QUEUE_KEY, []);
      pending.forEach(function (entry, idx) {
        setTimeout(function () { post(entry); }, idx * 600);
      });
    }
  }
})();
</script>

</body>
</html>
