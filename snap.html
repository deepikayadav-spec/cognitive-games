<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snap</title>
<meta name="theme-color" content="#190508">
<link rel="icon" href="niat-logo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .wrap{display:flex; flex-direction:column; align-items:center; gap:clamp(16px,3.6vh,34px)}

  .rule{
    font-size:clamp(12px,2vw,14px); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    padding:8px 18px; border-radius:99px; color:#3A1006; background:var(--grad-amber);
    box-shadow:0 4px 0 #9A8A3F, inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .2s cubic-bezier(.2,1.5,.4,1);
  }
  .rule.flip{transform:scale(1.12)}

  .word{
    font-size:clamp(46px,13vw,104px); font-weight:800; letter-spacing:-.03em; line-height:1;
    text-shadow:0 6px 18px rgba(0,0,0,.55); user-select:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .word.gone{opacity:0; transform:scale(.9)}

  .swatches{display:flex; gap:clamp(10px,2.6vw,20px); flex-wrap:wrap; justify-content:center}
  .sw{
    width:clamp(62px,13vw,96px); height:clamp(62px,13vw,96px); border-radius:20px; border:0;
    cursor:pointer; position:relative;
    box-shadow:0 7px 0 rgba(0,0,0,.42), inset 0 3px 0 rgba(255,255,255,.35),
      inset 0 -4px 0 rgba(0,0,0,.25), 0 14px 26px rgba(0,0,0,.4);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .sw:hover{transform:translateY(-3px)}
  .sw:active{transform:translateY(5px);
    box-shadow:0 2px 0 rgba(0,0,0,.42), inset 0 3px 8px rgba(0,0,0,.35)}
  .sw.right::after, .sw.wrong::after{
    content:''; position:absolute; inset:-5px; border-radius:24px; pointer-events:none;
  }
  .sw.right::after{box-shadow:0 0 0 3px var(--green-lite), 0 0 30px rgba(91,214,154,.5)}
  .sw.wrong::after{box-shadow:0 0 0 3px var(--coral), 0 0 30px rgba(255,122,99,.45)}

  .beat{display:flex; gap:5px}
  .beat i{width:9px; height:9px; border-radius:50%; background:rgba(245,239,187,.16)}
  .beat i.hit{background:var(--green-lite)}
  .beat i.miss{background:var(--coral)}
  .beat i.now{background:var(--amber); transform:scale(1.35)}
  .hintline{color:var(--muted); font-size:12.5px; font-weight:600; text-align:center}
  /* the score flash sits high by default and would land on the rule pill */
  .flash{top:2%}
  .verdict{
    min-height:22px; font-size:14px; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; opacity:0; transition:opacity .15s ease;
  }
  .verdict.on{opacity:1}
</style>
</head>
<body>
<script src="common.js"></script>
<script>
(function () {
  "use strict";

  /* Six hues chosen for distance from each other, not for prettiness: the
     closest pair here is 103 apart in RGB. The old set had green and teal only
     56 apart and both in the opening four, so an honest answer could look
     wrong. The first four are the ones levels 1-2 play with. */
  var COLOURS = [
    {name:'RED',    hex:'#E23B34'},
    {name:'BLUE',   hex:'#3E7BFA'},
    {name:'GREEN',  hex:'#35C46B'},
    {name:'GOLD',   hex:'#F0B429'},
    {name:'VIOLET', hex:'#A46BF5'},
    {name:'PINK',   hex:'#FF5FA2'}
  ];

  /* more swatches to choose between, less time to choose */
  function palette(level){ return level < 3 ? 4 : level < 6 ? 5 : 6; }
  function trials(level){ return Math.min(8 + Math.floor(level / 3), 12); }
  function limit(level){ return Math.max(650, 2400 - (level - 1) * 190); }   // ms to answer
  /* the rule starts steady, then alternates, then goes random every trial */
  function ruleFor(level, trial){
    if (level < 2) return 'ink';
    if (level < 4) return trial % 2 === 0 ? 'ink' : 'word';
    return Math.random() < 0.5 ? 'ink' : 'word';
  }

  function buildLevel(api, board){
    var level = api.level(), ms = limit(level);
    var pool = COLOURS.slice(0, palette(level));
    var TRIALS = trials(level);
    var timers = [];

    var wrap = CG.el('div', 'wrap');
    var ruleEl = CG.el('div', 'rule', 'TAP THE INK');
    var wordEl = CG.el('div', 'word', '');
    var beats = CG.el('div', 'beat');
    var dots = [];
    for (var b = 0; b < TRIALS; b++){
      var dot = CG.el('i');
      beats.appendChild(dot);
      dots.push(dot);
    }
    var swatches = CG.el('div', 'swatches');
    var buttons = pool.map(function (c, i){
      var s = CG.el('button', 'sw');
      s.style.background = 'linear-gradient(180deg,' + CG.shade(c.hex, 0.1) + ',' +
                     CG.shade(c.hex, -0.08) + ')';
      s.setAttribute('aria-label', c.name);
      s.addEventListener('click', function (){ answer(i, s); });
      swatches.appendChild(s);
      return s;
    });
    var verdict = CG.el('div', 'verdict');
    var hint = CG.el('div', 'hintline', 'the word lies — read the rule, not the text');

    wrap.appendChild(ruleEl); wrap.appendChild(wordEl); wrap.appendChild(beats);
    wrap.appendChild(swatches); wrap.appendChild(verdict); wrap.appendChild(hint);
    board.appendChild(wrap);

    var at = -1, want = -1, answered = true, running = true;

    function clearMarks(){
      buttons.forEach(function (s){ s.className = 'sw'; });
      verdict.className = 'verdict';
    }
    function sayAnswer(){
      verdict.textContent = pool[want].name + ' was the answer';
      verdict.style.color = pool[want].hex;
      verdict.className = 'verdict on';
    }

    function answer(i, node){
      if (!running || answered) return;
      answered = true;
      clearTimers();
      if (i === want){
        node.classList.add('right');
        dots[at].className = 'hit';
        api.tally(3);
      } else {
        node.classList.add('wrong');
        buttons[want].classList.add('right');
        dots[at].className = 'miss';
        sayAnswer();
        api.tally(-1);
      }
      timers.push(setTimeout(next, 620));
    }

    function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

    function next(){
      clearMarks();
      at++;
      if (at >= TRIALS){
        running = false;
        api.prompt('round clear — speeding up ⚡');
        api.after(700, api.nextLevel);
        return;
      }

      var rule = ruleFor(level, at);
      var wordIdx = CG.randInt(pool.length);
      var inkIdx;
      /* a trial is only a Stroop trial if the two disagree */
      do { inkIdx = CG.randInt(pool.length); } while (inkIdx === wordIdx && Math.random() < 0.85);

      want = rule === 'ink' ? inkIdx : wordIdx;

      var nextRule = rule === 'ink' ? 'TAP THE INK' : 'TAP THE WORD';
      if (ruleEl.textContent !== nextRule){
        ruleEl.textContent = nextRule;
        ruleEl.classList.add('flip');
        CG.sfx('select');
        timers.push(setTimeout(function (){ ruleEl.classList.remove('flip'); }, 220));
      }

      wordEl.textContent = pool[wordIdx].name;
      wordEl.style.color = pool[inkIdx].hex;
      wordEl.classList.remove('gone');
      dots[at].className = 'now';
      answered = false;

      timers.push(setTimeout(function (){
        if (answered) return;
        answered = true;
        wordEl.classList.add('gone');
        buttons[want].classList.add('right');
        dots[at].className = 'miss';
        sayAnswer();
        api.tally(-1, 'too slow');
        timers.push(setTimeout(next, 420));
      }, ms));
    }

    api.prompt('Read the banner — the rule flips ⚡');
    timers.push(setTimeout(next, 600));

    var obs = new MutationObserver(function (){
      if (!board.contains(wrap)){
        running = false;
        clearTimers();
        obs.disconnect();
      }
    });
    obs.observe(board, {childList:true});
  }

  CG.create({
    slug:'snap',
    name:'Snap',
    tag:'Attention and impulse control',
    prompt:'Read the banner — the rule flips',
    intro:['A colour name appears, printed in the wrong colour. The banner above it is the rule: ' +
           'TAP THE INK means the colour it is printed in, TAP THE WORD means what it says.',
           'Reading is automatic, so the word fights you. From level 2 the banner starts ' +
           'alternating, and from level 4 it changes at random every single trial — which is ' +
           'where autopilot gets punished.'],
    howto:['+3 for the right swatch, −1 for a wrong one or running out of time',
           'The banner is the only thing that decides the answer — check it every trial',
           '4 swatches become 6, and 2.4s an answer becomes 0.65s'],
    session:240,
    levelTime:null,
    pointsRight:3, pointsWrong:1, scoreFull:80,
    nextDelay:600,
    buildLevel:buildLevel
  });
})();
</script>
</body>
</html>
